<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Site Data Crawler</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <img src="icons/icon32.png" alt="Logo" class="brand-icon" width="24" height="24">
        <div>
          <h1 class="brand-title">Site Data Crawler</h1>
          <p class="brand-subtitle">Extract, analyze and export website content</p>
        </div>
      </div>
      <button id="btnOptions" class="icon-button" title="Open Settings" aria-label="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
        </svg>
      </button>
    </header>

    <!-- Main Form -->
    <main class="popup-main">
      <!-- Target URL Input -->
      <section class="form-group">
        <div class="input-label-row">
          <label for="inputUrl" class="form-label">Website URL</label>
          <button id="btnCurrentTab" class="text-link-btn" type="button">Use Active Tab</button>
        </div>
        <div class="url-input-wrapper">
          <input 
            type="url" 
            id="inputUrl" 
            class="form-input" 
            placeholder="https://example.com" 
            required 
            autocomplete="url"
            spellcheck="false"
          >
        </div>
        <div id="activeTabIndicator" class="active-tab-indicator hidden">
          <span class="active-tab-pulse"></span>
          <span id="activeTabLabel" class="active-tab-text">Auto-fetched active tab URL</span>
        </div>
      </section>

      <!-- Action Buttons -->
      <div class="action-buttons-group">
        <button id="btnStartCrawl" class="btn btn-primary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          Start Crawl
        </button>
        <button id="btnOpenDashboard" class="btn btn-secondary" type="button">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
            <line x1="3" y1="9" x2="21" y2="9"></line>
            <line x1="9" y1="21" x2="9" y2="9"></line>
          </svg>
          Dashboard
        </button>
      </div>

      <!-- Quick Settings Accordion -->
      <details class="settings-accordion" open>
        <summary class="accordion-header">
          <span class="accordion-title">Crawl Settings</span>
          <span class="accordion-badge" id="settingsSummaryBadge">100 pgs • 500ms</span>
        </summary>

        <div class="accordion-content">
          <!-- Crawl Mode -->
          <div class="control-row">
            <label for="selectCrawlMode" class="sub-label">Crawl Mode</label>
            <select id="selectCrawlMode" class="form-select">
              <option value="sitemap_and_links">Sitemap + discovered links</option>
              <option value="sitemap">Sitemap only</option>
              <option value="links_only">Direct link crawl (No sitemap)</option>
            </select>
          </div>

          <!-- Max Pages -->
          <div class="control-row">
            <label for="selectMaxPages" class="sub-label">Max Pages</label>
            <div class="inline-input-group">
              <select id="selectMaxPages" class="form-select">
                <option value="10">10 pages</option>
                <option value="50">50 pages</option>
                <option value="100" selected>100 pages</option>
                <option value="500">500 pages</option>
                <option value="custom">Custom...</option>
              </select>
              <input type="number" id="inputCustomPages" class="form-input custom-number-input hidden" min="1" max="10000" placeholder="e.g. 250">
            </div>
          </div>

          <!-- Crawl Delay -->
          <div class="control-row">
            <label for="selectCrawlDelay" class="sub-label">Crawl Delay</label>
            <div class="inline-input-group">
              <select id="selectCrawlDelay" class="form-select">
                <option value="0">0 ms (Fast)</option>
                <option value="250">250 ms</option>
                <option value="500" selected>500 ms (Safe)</option>
                <option value="1000">1000 ms (Polite)</option>
                <option value="custom">Custom...</option>
              </select>
              <input type="number" id="inputCustomDelay" class="form-input custom-number-input hidden" min="0" max="60000" step="50" placeholder="ms">
            </div>
          </div>

          <!-- Options Checkboxes -->
          <fieldset class="options-fieldset">
            <legend class="options-legend">Scope & Extraction Rules</legend>
            <div class="checkbox-grid">
              <label class="checkbox-label">
                <input type="checkbox" id="chkSameDomain" checked>
                <span>Same-domain only</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chkIncludeSubdomains">
                <span>Include subdomains</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chkFollowLinks" checked>
                <span>Follow discovered links</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chkExtractMetadata" checked>
                <span>Extract metadata</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chkExtractHeadings" checked>
                <span>Extract headings</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chkExtractLinks" checked>
                <span>Extract links</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chkExtractImages" checked>
                <span>Extract images</span>
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="chkExtractStructuredData" checked>
                <span>Extract structured data</span>
              </label>
            </div>
          </fieldset>
        </div>
      </details>

      <!-- Status banner / Notice -->
      <div id="statusBanner" class="status-banner hidden"></div>
    </main>

    <!-- Footer -->
    <footer class="popup-footer">
      <div class="footer-meta">
        <span>Manifest V3</span>
        <span>•</span>
        <span class="safe-badge">Safe Local Extraction</span>
      </div>
      <button id="btnClearCache" class="footer-link-btn" type="button">Clear Data</button>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
